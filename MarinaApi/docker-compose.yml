services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: marina-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "TuPassword123!"
    ports:
      - "1433:1433"
    volumes:
      - marina-data:/var/opt/mssql

volumes:
  marina-data:
