# Base de datos de desarrollo de MarinaApi (MySQL 8).
#
# La contraseña de root NO va en este archivo (se sube a GitHub): se lee de
# la variable MYSQL_ROOT_PASSWORD del archivo .env, que está en .gitignore.
# Copia .env.example a .env, rellénalo y ejecuta: docker compose up -d
#
# El puerto se publica solo en 127.0.0.1: MySQL es accesible desde este
# equipo, pero no desde otros equipos de la red local.
#
# La API NO se conecta como root, sino con el usuario 'marina_app', que solo
# tiene permisos sobre gestion_maritima (ver MIGRACION_JAVA_A_CSHARP.md, 2.6).
services:
  mysql:
    image: mysql:8.0
    container_name: marina-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en el archivo .env}
      MYSQL_DATABASE: gestion_maritima
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - marina-mysql-data:/var/lib/mysql

volumes:
  marina-mysql-data:
